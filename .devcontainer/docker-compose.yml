services:
  bluerovws:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    # keep the container alive: a bare bash exits immediately without a TTY
    command: ["/bin/sh", "-c", "while sleep 1000; do :; done"]
    privileged: true    # needed for USB/serial access (sonar, IMU)
    tmpfs:
      - /dev/shm:size=4g   # increased to 4GB
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - LIBGL_ALWAYS_INDIRECT=1
      - ROS_DOMAIN_ID=161
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - ..:/home/bluerovuser/volumeROS:cached
      - ../cache/humble/build:/home/bluerovuser/ros_ws/build
      - ../cache/humble/install:/home/bluerovuser/ros_ws/install:cached
      - ../cache/humble/log:/home/bluerovuser/ros_ws/log:cached
      - ../src:/home/bluerovuser/ros_ws/src:cached
      - /tmp/.X11-unix:/tmp/.X11-unix
    # Host network: ROS DDS discovery + Foxglove bridge reachable from the rest
    # of the robot's network without port mapping.
    network_mode: host